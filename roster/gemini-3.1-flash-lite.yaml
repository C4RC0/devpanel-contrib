id: gemini-3.1-flash-lite
title: Gemini 3.1 Flash Lite (via Gemini CLI)
harness: gemini
model: gemini-3.1-flash-lite
efforts: []
defaultEffort: null
contextWindow: ~
credentialRef: file:~/.config/gemini/key
verification:
  status: verified
  verifiedAt: ~
  method: API model listing, session resume, live fence and installed runtime policy verification
  notes: >
    API authentication, model listing and session continuity passed. The live
    read-only workspace stayed unchanged. The installed CLI's policy engine
    excluded write, shell and mode-transition tools and denied forced calls
    above a permissive control. The proof matched the SHA-256 of the policy
    acknowledged by the live turn. Writer policies (read-only roots beside,
    above and inside the worktree; `.`, `..`, `//`, NUL and relative spellings;
    scratch and worktree carve-outs; shell excluded) were decided by the
    installed CLI's own policy engine, without a live turn. The read-only mount
    that is the actual boundary is exercised by the offline suite
    (gui/test/gemini.test.mjs section 2g) with a shell inside the sandbox.
notes: >
  The cheap seat on this harness, for auditing and triage rather than authoring.
  Same runtime facts as gemini-3.1-pro: no effort control, no cost reporting, no
  write or shell tools for a role that is not the source writer, no shell for a
  writer with read-only roots (bind-mounted read-only through bubblewrap and
  proved before launch; writes into them also denied by argument pattern with
  every non-canonical spelling refused), a turn accepted only once the runtime
  acknowledged its policy file, and the API key pinned through system settings.
