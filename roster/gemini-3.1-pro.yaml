id: gemini-3.1-pro
title: Gemini 3.1 Pro (preview, via Gemini CLI)
harness: gemini
model: gemini-3.1-pro-preview
efforts: []
defaultEffort: null
contextWindow: ~
credentialRef: file:~/.config/gemini/key
verification:
  status: verified
  verifiedAt: ~
  method: API model listing, session resume, live fence and installed runtime policy verification
  notes: >
    API authentication, model listing and session continuity passed. The live
    read-only workspace stayed unchanged. The installed CLI's policy engine
    excluded write, shell and mode-transition tools and denied forced calls
    above a permissive control. The proof matched the SHA-256 of the policy
    acknowledged by the live turn. Writer policies (read-only roots beside,
    above and inside the worktree; `.`, `..`, `//`, NUL and relative spellings;
    scratch and worktree carve-outs; shell excluded) were decided by the
    installed CLI's own policy engine, without a live turn. The read-only mount
    that is the actual boundary is exercised by the offline suite
    (gui/test/gemini.test.mjs section 2g) with a shell inside the sandbox.
notes: >
  Runs through Google's Gemini CLI. `efforts: []` is a fact about this runtime,
  not an unknown: the CLI exposes no effort or thinking control, by flag or by
  setting, so a playbook naming an effort is refused rather than silently run at
  whatever the runtime picked. The wire identifier is one the installed CLI's own
  model configuration routes to; confirm it against the account's model list
  during verification, because an unrecognised name is a silent substitution
  risk here as it is with DeepSeek. Cost is unknown rather than estimated: the
  CLI reports tokens only, so runs on this entry draw on the unpriced allowance.
  A role that does not write source gets no write and no shell tools at all on
  this harness — the fence is a policy — so a Gemini seat cannot run tests or
  write scratch notes unless it is the author; and an author given read-only
  roots (every tactical run's evidence directory) keeps its file tools, runs with
  those roots bind-mounted read-only through bubblewrap (proved before launch;
  a host without it refuses the turn), has writes into them also denied by
  argument pattern with every non-canonical spelling (`.`, `..`, `//`, NUL,
  relative) refused, and loses the shell for that turn.
  Each turn is accepted only after the runtime acknowledged the policy file on
  stderr; the API key is pinned as the auth method through system settings.
