# An example of a host-only roster entry: another person's login on the same
# provider (`account`), which belongs to this installation, not to the shared
# catalogue in roster/. Copy it to host-config/roster/ and log in once against
# the isolated config directory it names (account-<name>).
id: example-account-opus-5-5
title: Claude Opus 5.5 (example account)
harness: claude
profile: default
model: claude-opus-5-5
account: example
efforts: [low, medium, high, xhigh, max]
defaultEffort: medium
contextWindow: 1000000
verification:
  status: unverified
  verifiedAt: ~
  method: ~
notes: >
  Example only. Unverified entries resolve for preview and are refused for live
  runs until the bounded live session check passes for this login.
